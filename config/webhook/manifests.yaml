---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-s3-bedag-ch-v1alpha1-s3tenant
  failurePolicy: Fail
  name: ms3tenant.kb.io
  rules:
  - apiGroups:
    - s3.bedag.ch
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - s3tenants
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-s3-bedag-ch-v1alpha1-s3tenantaccount
  failurePolicy: Fail
  name: vs3tenantaccount.kb.io
  rules:
  - apiGroups:
    - s3.bedag.ch
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - s3tenantaccounts
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-s3-bedag-ch-v1alpha1-s3bucket
  failurePolicy: Fail
  name: vs3bucket.kb.io
  rules:
  - apiGroups:
    - s3.bedag.ch
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - s3buckets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-s3-bedag-ch-v1alpha1-s3tenant
  failurePolicy: Fail
  name: vs3tenant.kb.io
  rules:
  - apiGroups:
    - s3.bedag.ch
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - s3tenants
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-s3-bedag-ch-v1alpha1-s3tenantaccount
  failurePolicy: Fail
  name: vs3tenantaccount.kb.io
  rules:
  - apiGroups:
    - s3.bedag.ch
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - s3tenantaccounts
  sideEffects: None
