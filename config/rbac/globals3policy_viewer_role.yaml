# This rule is not used by the project storagegrid-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to s3.bedag.ch resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: storagegrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: globals3policy-viewer-role
rules:
- apiGroups:
  - s3.bedag.ch
  resources:
  - globals3policies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - s3.bedag.ch
  resources:
  - globals3policies/status
  verbs:
  - get
