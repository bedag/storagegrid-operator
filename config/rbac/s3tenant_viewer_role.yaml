# permissions for end users to view s3tenants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: storagegrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: s3tenant-viewer-role
rules:
- apiGroups:
  - s3.bedag.ch
  resources:
  - s3tenants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - s3.bedag.ch
  resources:
  - s3tenants/status
  verbs:
  - get
