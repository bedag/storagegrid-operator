apiVersion: s3.bedag.ch/v1alpha1
kind: S3Access
metadata:
  labels:
    app.kubernetes.io/name: storagegrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: sample-admin
spec:
  policyRefs:
    - name: admin
    - name: specific-s3-policy
      kind: S3Policy
  s3BucketRef:
    name: sample
  # Operator-synthesized connection-details Secret containing AWS-style env vars
  # (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL, AWS_REGION, S3_BUCKET).
  # This is a projection of the credentials Secret (status.secretRef) plus the bucket
  # endpoint info, mountable directly via `envFrom`. Defaults to {mode: All}; set
  # mode: Disabled to opt out (the raw keypair Secret in status.secretRef remains).
  connectionDetails:
    mode: All
    # destinationSecret: my-access-conn
