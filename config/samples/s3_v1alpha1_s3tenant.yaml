apiVersion: s3.bedag.ch/v1alpha1
kind: S3Tenant
metadata:
  labels:
    app.kubernetes.io/name: storagegrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: s3tenant-sample
spec:
  name: my-tenant
  description: "Sample S3 Tenant"
  s3TenantClassName: default
  defaultBucketRegion: us-east-1
  storageQuota: 100Gi
  storageGridRef:
    name: storagegrid-sample
  # S3 Object Lock policy applied to all buckets owned by this tenant.
  # mode acts as the ceiling on bucket-level mode (Disabled < Governance < Compliance).
  # maxRetentionInDays caps the per-bucket retentionInDays.
  s3ObjectLock:
    mode: Governance
    maxRetentionInDays: 90
