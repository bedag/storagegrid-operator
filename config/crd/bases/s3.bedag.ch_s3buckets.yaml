---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: s3buckets.s3.bedag.ch
spec:
  group: s3.bedag.ch
  names:
    kind: S3Bucket
    listKind: S3BucketList
    plural: s3buckets
    shortNames:
    - s3bus
    - s3bu
    singular: s3bucket
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The tenant the bucket belongs to
      jsonPath: .spec.s3TenantRef.name
      name: Tenant
      type: string
    - description: The name of the bucket in the backned
      jsonPath: .status.bucketName
      name: BucketName
      type: string
    - description: The region of the bucket
      jsonPath: .status.region
      name: Region
      type: string
    - description: S3 API endpoint address
      jsonPath: .status.s3EndpointConfig.defaultAddress
      name: Endpoint
      type: string
    - description: Current lifecycle phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Number of objects in bucket
      jsonPath: .status.bucketUsage.objectCount
      name: Objects
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: S3Bucket is the Schema for the s3buckets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: S3BucketSpec defines the desired state of S3Bucket.
            properties:
              bucketName:
                description: |-
                  If bucketName the operator will try to create the bucket with the name
                  set here instead of using the default metadata.name-<resource-uid> format.
                  Note that bucket names must be globally unique in S3, so this may lead to creation failures
                  if the specified name is already taken.
                  This field is only honored during creation.
                  After successful creation, the effective name is recorded in status.bucketName
                  and further changes to this field are ignored.
                type: string
              bucketPolicyJson:
                description: |-
                  specify a s3 bucketpolicy as json to apply to the bucket.
                  check the s3 documentation for the policy json format.
                type: string
              drainPollInterval:
                description: |-
                  DrainPollInterval overrides the StorageGrid drain polling frequency for this bucket.
                  When set, replaces the two-tier polling strategy with this single interval.
                  Use for buckets needing different polling behavior (e.g., huge bucket = 4h+, urgent = 1m).
                type: string
              drainStuckThreshold:
                description: |-
                  DrainStuckThreshold overrides when to consider this bucket's drain stuck.
                  Use for buckets with expected slow drain rates (e.g., 24h+ for multi-billion object bucket).
                type: string
              region:
                description: region of the S3 Bucket.
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              retentionInDays:
                default: 0
                description: Optional retention in days for objects in the bucket,
                  defaults to 0, meaning unlimited retention.
                format: int32
                type: integer
              s3TenantRef:
                description: tenant the bucket will be created in.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: s3TenantRef is immutable
                  rule: self == oldSelf
            type: object
          status:
            description: S3BucketStatus defines the observed state of S3Bucket.
            properties:
              accessKeyId:
                description: S3 Access Key ID for the bucket admin.
                type: string
              bucketName:
                description: The bucketname is generated automatically to prevent
                  duplication.
                type: string
                x-kubernetes-validations:
                - message: bucketName is immutable
                  rule: self == oldSelf
              bucketUsage:
                description: BucketUsage is the total uf bytes and objects in this
                  bucket.
                properties:
                  bytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: total resources used by the S3 Bucket.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  objectCount:
                    default: 0
                    description: total objects stored in the S3 Bucket.
                    type: integer
                required:
                - objectCount
                type: object
              conditions:
                description: |-
                  Track s3Bucket conditions.
                  Conditions is an array of conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              drainStatus:
                description: |-
                  DrainStatus tracks active drain operation progress.
                  Only present during active drain. Cleared when drain completes or is canceled.
                properties:
                  initialObjectBytes:
                    description: InitialObjectBytes is the total bytes when drain
                      started.
                    format: int64
                    type: integer
                  initialObjectCount:
                    description: InitialObjectCount is the number of objects when
                      drain started.
                    format: int32
                    type: integer
                  isDeletingObjects:
                    description: IsDeletingObjects indicates if StorageGrid is currently
                      deleting objects.
                    type: boolean
                  lastCheckedAt:
                    description: LastCheckedAt is when we last polled the backend
                      for status.
                    format: date-time
                    type: string
                  lastProgressAt:
                    description: LastProgressAt is when object count last decreased
                      (for stuck detection).
                    format: date-time
                    type: string
                  message:
                    description: Message provides human-readable status information.
                    type: string
                  nextPollInterval:
                    description: |-
                      NextPollInterval is when to requeue the next reconcile.
                      Re-computed on every drain reconciliation based on current config + elapsed time.
                      Allows config changes to take effect immediately.
                    type: string
                  previousObjectCount:
                    description: PreviousObjectCount is the object count from last
                      check (to detect progress).
                    format: int64
                    type: integer
                  startedAt:
                    description: |-
                      StartedAt marks when the drain operation began.
                      If nil while IsDeletingObjects=true, indicates orphaned drain (not initiated by operator).
                    format: date-time
                    type: string
                required:
                - isDeletingObjects
                - nextPollInterval
                type: object
              lastAppliedPolicy:
                description: track last successfully applied policy.
                type: string
              phase:
                default: Pending
                description: Phase represents the current lifecycle phase of the bucket.
                type: string
              region:
                description: The region the bucket is created in.
                type: string
              s3AdminKeysSecretRef:
                description: |-
                  SecretRef for the bucket-admin s3 keys.
                  secret will be created and overridden by the operator, defaults to <S3 Tenant>-s3-admin-keypair.
                  the secret must contain the following keys:
                    data:
                      accessKeyId: <base64 encoded access key id>
                      secretAccessKey: <base64 encoded secret access key>
                  this is the administrative keypair to manage this buckets and it's objects.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              s3EndpointConfig:
                description: s3 endpoint configuration for the bucket.
                properties:
                  addresses:
                    description: |-
                      Addresses is the deduplicated list of DNS names and IP addresses for this S3 endpoint.
                      All addresses point to the same gateway/loadbalancer configuration.
                      Addresses always atleast contains the DefaultAddress.
                    items:
                      type: string
                    type: array
                  defaultAddress:
                    description: |-
                      DefaultAddress is the primary address from the Addresses list.
                      This is the recommended address to use for S3 API access.
                    type: string
                  pathStyleAccess:
                    default: false
                    description: |-
                      PathStyleAccess indicates if path-style S3 access is required.
                      When true, use path-style URLs (https://endpoint/bucket/key).
                      When false, use virtual-hosted-style URLs (https://bucket.endpoint/key).
                      Defaults to false if not set.
                    type: boolean
                  port:
                    description: Port is the HTTPS port for S3 API access.
                    format: int32
                    type: integer
                  s3TenantClassName:
                    default: ""
                    description: TenantClassName which this S3EndpointConfig belongs
                      to.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
