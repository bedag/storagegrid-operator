apiVersion: s3.bedag.ch/v1alpha1
kind: S3Bucket
metadata:
  labels:
    app.kubernetes.io/name: storagegrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: s3bucket-sample
spec:
  s3TenantRef:
    name: s3tenant-sample
    namespace: default
  region: us-east-1
  # Optional S3 Object Lock configuration. Mode defaults to Disabled.
  # Compliance requires the parent tenant to have s3ObjectLock.mode=Compliance and the
  # parent StorageGrid to have S3 Object Lock enabled grid-wide.
  # Changes to retentionInDays apply to NEW objects only; existing objects keep their prior retention.
  s3ObjectLock:
    mode: Governance
    retentionInDays: 30
