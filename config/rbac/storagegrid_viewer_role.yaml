# permissions for end users to view storagegrids.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: storagegrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: storagegrid-viewer-role
rules:
- apiGroups:
  - s3.bedag.ch
  resources:
  - storagegrids
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - s3.bedag.ch
  resources:
  - storagegrids/status
  verbs:
  - get
