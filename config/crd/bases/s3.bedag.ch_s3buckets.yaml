---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: s3buckets.s3.bedag.ch
spec:
  group: s3.bedag.ch
  names:
    kind: S3Bucket
    listKind: S3BucketList
    plural: s3buckets
    shortNames:
    - s3bus
    - s3bu
    singular: s3bucket
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The tenant the bucket belongs to
      jsonPath: .spec.s3TenantRef.name
      name: Tenant
      type: string
    - description: The name of the bucket in the backned
      jsonPath: .status.bucketName
      name: BucketName
      type: string
    - description: The region of the bucket
      jsonPath: .status.region
      name: Region
      type: string
    - description: S3 API endpoint address
      jsonPath: .status.s3EndpointConfig.defaultAddress
      name: Endpoint
      type: string
    - description: Current lifecycle phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Number of objects in bucket
      jsonPath: .status.bucketUsage.objectCount
      name: Objects
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: S3Bucket is the Schema for the s3buckets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: S3BucketSpec defines the desired state of S3Bucket.
            properties:
              bucketName:
                description: |-
                  If bucketName the operator will try to create the bucket with the name
                  set here instead of using the default metadata.name-<resource-uid> format.
                  Note that bucket names must be globally unique in S3, so this may lead to creation failures
                  if the specified name is already taken.
                  This field is only honored during creation.
                  After successful creation, the effective name is recorded in status.bucketName
                  and further changes to this field are ignored.
                type: string
              bucketPolicyJson:
                description: |-
                  specify a s3 bucketpolicy as json to apply to the bucket.
                  check the s3 documentation for the policy json format.
                type: string
              connectionDetails:
                default:
                  mode: All
                description: |-
                  ConnectionDetails controls whether the operator synthesizes a Kubernetes Secret
                  containing the data needed to connect to this bucket (access key id, secret access key,
                  endpoint URL, region, bucket name) for direct consumption by user workloads.
                  Defaults to {mode: All}.
                properties:
                  destinationSecret:
                    description: |-
                      DestinationSecret optionally overrides the name of the synthesized Secret.
                      When empty, the operator uses `<resource-name>-connection-details`.
                      The Secret is always created in the same namespace as the source CR.
                    type: string
                  mode:
                    default: All
                    description: |-
                      Mode controls whether a connection-details Secret is synthesized.
                      Defaults to All
                      Available options:
                      - All: create/update a Secret containing all standard connection-detail keys.
                      - Disabled: do not create such a Secret, and remove a previously-created one if present.
                    enum:
                    - All
                    - Disabled
                    type: string
                type: object
              drainPollInterval:
                description: |-
                  DrainPollInterval overrides the StorageGrid drain polling frequency for this bucket.
                  When set, replaces the two-tier polling strategy with this single interval.
                  Use for buckets needing different polling behavior (e.g., huge bucket = 4h+, urgent = 1m).
                type: string
              drainStuckThreshold:
                description: |-
                  DrainStuckThreshold overrides when to consider this bucket's drain stuck.
                  Use for buckets with expected slow drain rates (e.g., 24h+ for multi-billion object bucket).
                type: string
              lifecycleManagement:
                default:
                  expirationInDays: 0
                description: |-
                  LifecycleManagement controls the operator-managed S3 bucket lifecycle configuration.
                  Defaults to {expirationInDays: 0}, which disables lifecycle management for the bucket
                  (any previously-applied lifecycle configuration will be removed by the operator).
                  Setting expirationInDays > 0 instructs StorageGRID to delete current object versions
                  after that many days from ingestion. Note: on versioned buckets, this only places a
                  delete marker on the current version; previous versions are not removed (an event will be
                  emitted in that case).
                properties:
                  expirationInDays:
                    description: |-
                      ExpirationInDays is the number of days from object ingestion after which the current
                      version of an object is deleted by StorageGRID. Maps to the S3 lifecycle rule
                      `Expiration.Days`.
                      Set to 0 to explicitly disable lifecycle management for this bucket. Any previously
                      applied lifecycle configuration will be removed by the operator.
                      On versioned buckets, expiration only places a delete marker on the current version;
                      noncurrent versions are NOT removed by this rule (a warning event is emitted).
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - expirationInDays
                type: object
              region:
                description: region of the S3 Bucket.
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              s3ObjectLock:
                description: |-
                  S3ObjectLock configures S3 Object Lock for this bucket.
                  When omitted, object lock is disabled (Mode=Disabled).
                  Requires the parent StorageGrid to have S3 Object Lock enabled grid-wide.
                  Compliance mode additionally requires the parent tenant's s3ObjectLock.mode to be Compliance.
                  Note: changes to mode/retention apply to NEW objects only; existing objects keep their prior settings.
                properties:
                  mode:
                    default: Disabled
                    description: |-
                      Mode is the default retention mode applied to new objects.
                      - Disabled: object lock is not enabled on the bucket.
                      - Governance: privileged users may bypass retention.
                      - Compliance: retention is strictly enforced; requires tenant.s3ObjectLock.mode=Compliance.
                    enum:
                    - Disabled
                    - Governance
                    - Compliance
                    type: string
                  retentionInDays:
                    description: |-
                      RetentionInDays is the default retention period applied to new objects when Mode is not Disabled.
                      Must be greater than zero. Capped by the parent tenant's s3ObjectLock.maxRetentionInDays.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              s3TenantRef:
                description: tenant the bucket will be created in.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: s3TenantRef is immutable
                  rule: self == oldSelf
            type: object
          status:
            description: S3BucketStatus defines the observed state of S3Bucket.
            properties:
              accessKeyId:
                description: S3 Access Key ID for the bucket admin.
                type: string
              bucketName:
                description: |-
                  The bucketname is generated automatically to prevent duplication.
                  Managed by the controller — set only after successful backend creation.
                type: string
              bucketUsage:
                description: BucketUsage is the total uf bytes and objects in this
                  bucket.
                properties:
                  bytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: total resources used by the S3 Bucket.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  objectCount:
                    default: 0
                    description: total objects stored in the S3 Bucket.
                    type: integer
                required:
                - objectCount
                type: object
              conditions:
                description: |-
                  Track s3Bucket conditions.
                  Conditions is an array of conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionDetailsSecretRef:
                description: |-
                  ConnectionDetailsSecretRef is set to the user-facing connection-details Secret
                  projected by the operator (when spec.connectionDetails.mode is All). Cleared when
                  mode is Disabled. Tracks the actually-deployed Secret name so a destinationSecret
                  rename or a re-enable after Disabled can clean up the previous Secret.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              drainStatus:
                description: |-
                  DrainStatus tracks active drain operation progress.
                  Only present during active drain. Cleared when drain completes or is canceled.
                properties:
                  initialObjectBytes:
                    description: InitialObjectBytes is the total bytes when drain
                      started.
                    format: int64
                    type: integer
                  initialObjectCount:
                    description: InitialObjectCount is the number of objects when
                      drain started.
                    format: int32
                    type: integer
                  isDeletingObjects:
                    description: IsDeletingObjects indicates if StorageGrid is currently
                      deleting objects.
                    type: boolean
                  lastCheckedAt:
                    description: LastCheckedAt is when we last polled the backend
                      for status.
                    format: date-time
                    type: string
                  lastProgressAt:
                    description: LastProgressAt is when object count last decreased
                      (for stuck detection).
                    format: date-time
                    type: string
                  message:
                    description: Message provides human-readable status information.
                    type: string
                  nextPollInterval:
                    description: |-
                      NextPollInterval is when to requeue the next reconcile.
                      Re-computed on every drain reconciliation based on current config + elapsed time.
                      Allows config changes to take effect immediately.
                    type: string
                  previousObjectCount:
                    description: PreviousObjectCount is the object count from last
                      check (to detect progress).
                    format: int64
                    type: integer
                  startedAt:
                    description: |-
                      StartedAt marks when the drain operation began.
                      If nil while IsDeletingObjects=true, indicates orphaned drain (not initiated by operator).
                    format: date-time
                    type: string
                required:
                - isDeletingObjects
                - nextPollInterval
                type: object
              lastAppliedLifecycle:
                description: |-
                  LastAppliedLifecycle is a fingerprint of the lifecycle configuration last successfully applied.
                  Used by the operator for drift detection. Empty when no lifecycle configuration is managed.
                type: string
              lastAppliedPolicy:
                description: track last successfully applied policy.
                type: string
              phase:
                default: Pending
                description: Phase represents the current lifecycle phase of the bucket.
                type: string
              region:
                description: The region the bucket is created in.
                type: string
              s3AdminKeysSecretRef:
                description: |-
                  SecretRef for the bucket-admin s3 keys.
                  secret will be created and overridden by the operator, defaults to <S3 Tenant>-s3-admin-keypair.
                  the secret must contain the following keys:
                    data:
                      accessKeyId: <base64 encoded access key id>
                      secretAccessKey: <base64 encoded secret access key>
                  this is the administrative keypair to manage this buckets and it's objects.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              s3EndpointConfig:
                description: s3 endpoint configuration for the bucket.
                properties:
                  addresses:
                    description: |-
                      Addresses is the deduplicated list of DNS names and IP addresses for this S3 endpoint.
                      All addresses point to the same gateway/loadbalancer configuration.
                      Addresses always atleast contains the DefaultAddress.
                    items:
                      type: string
                    type: array
                  defaultAddress:
                    description: |-
                      DefaultAddress is the primary address from the Addresses list.
                      This is the recommended address to use for S3 API access.
                    type: string
                  pathStyleAccess:
                    default: false
                    description: |-
                      PathStyleAccess indicates if path-style S3 access is required.
                      When true, use path-style URLs (https://endpoint/bucket/key).
                      When false, use virtual-hosted-style URLs (https://bucket.endpoint/key).
                      Defaults to false if not set.
                    type: boolean
                  port:
                    description: Port is the HTTPS port for S3 API access.
                    format: int32
                    type: integer
                  protocol:
                    default: https
                    description: Protocol indicates the protocol to use for S3 API
                      access (e.g., "https").
                    type: string
                  s3TenantClassName:
                    default: ""
                    description: TenantClassName which this S3EndpointConfig belongs
                      to.
                    type: string
                  url:
                    description: |-
                      URL is the fully-qualified S3 endpoint URL composed from DefaultAddress and Port,
                      in the form `https://<defaultAddress>:<port>`. Populated by the operator whenever
                      the endpoint config is (re)computed; consumers should prefer this field over
                      re-composing the URL themselves.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
