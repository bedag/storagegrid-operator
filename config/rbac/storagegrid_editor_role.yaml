# permissions for end users to edit storagegrids.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: storagegrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: storagegrid-editor-role
rules:
- apiGroups:
  - s3.bedag.ch
  resources:
  - storagegrids
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - s3.bedag.ch
  resources:
  - storagegrids/status
  verbs:
  - get
