apiVersion: s3.bedag.ch/v1alpha1
kind: S3Tenant
metadata:
  labels:
    app.kubernetes.io/name: storagegrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: s3tenant-sample
spec:
  name: my-tenant
  description: "Sample S3 Tenant"
  s3TenantClassName: default
  defaultBucketRegion: us-east-1
  storageQuota: 100Gi
  storageGridRef:
    name: storagegrid-sample
  
